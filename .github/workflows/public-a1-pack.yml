name: A1 once-only controlled PACK
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: public-synthetic-formal-qualification
  cancel-in-progress: false
jobs:
  pack:
    if: github.repository == 'tim-zxy/CodeAtlas-validation-public-temp' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - name: Read fixed packaging controls
        timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Start context-bound job wall clock
        timeout-minutes: 1
        shell: pwsh
        run: ./control/public-pack-clock.ps1
      - name: Read frozen public source
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tim-zxy/CodeAtlas
          ref: a1f8fa950d1eea6699ced3ece058f06c53c1c6e1
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 1
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        timeout-minutes: 1
        with:
          version: 11.19.0
          run_install: false
      - name: Prepare copied frozen reader without Native rebuild
        timeout-minutes: 4
        shell: pwsh
        run: |
          if ((Get-PSDrive D).Free -lt 8GB) { throw 'PACK_FREE_DISK_INSUFFICIENT' }
          & ./control/a1-public-build.ps1 -SourceRoot '${{ github.workspace }}\source' -OutputRoot '${{ github.workspace }}\pack-work' -ReaderOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch only reviewed immutable inputs
        timeout-minutes: 1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-pack.mjs fetch ./source ./pack-work
      - name: Original admission and one PACK with decoded verification
        shell: pwsh
        run: node ./control/a1-public-pack.mjs pack ./source ./pack-work
      - name: Retain verified package without replacing prior assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-pack.mjs publish ./source ./pack-work
