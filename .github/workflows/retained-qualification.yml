  transport:
    needs:
      - verify
    timeout-minutes: 360
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Read fixed workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
