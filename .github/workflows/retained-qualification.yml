      - name: Fetch exact real release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/public-validation.mjs fetch-seed ./source '${{ runner.temp }}\public-validation'
      - name: Check identity then complete TRANSPORT154
