name: Public-safe Windows tool preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-safe-tool-preflight
  cancel-in-progress: false
jobs:
  tool-preflight:
    if: github.repository == 'tim-zxy/CodeAtlas-validation-public-temp' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Inspect tool seals without project inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            node = '3331e1ffe19874215472217c5e94f5a0c6d8e18c4ac7111d3937aa0ad5e9b4a5'
            powershell = '362a356ce7f0940ec74f73a8fc2c990a2cc24a38a11c90bbd8eca947110ad139'
            tar = 'a3ac62fd4cdf619a7c53f71ca3fe5fb42f72020975670ff29afe3603f6416a8e'
          }
          $tools = @{
            node = (Get-Command node.exe).Source
            powershell = (Get-Command pwsh.exe).Source
            tar = 'C:\Windows\System32\tar.exe'
          }
          $allMatch = $true
          $results = foreach ($role in @('node', 'powershell', 'tar')) {
            $sha = (Get-FileHash -LiteralPath $tools[$role] -Algorithm SHA256).Hash.ToLowerInvariant()
            $match = $sha -eq $expected[$role]
            if (-not $match) { $allMatch = $false }
            [ordered]@{ role = $role; sha256 = $sha; matchesR11Seal = $match }
          }
          [ordered]@{
            scope = 'STANDARD_RUNNER_TOOL_SEALS_ONLY'
            qualification = 'NOT_ATTEMPTED'
            personalInputs = $false
            allMatch = $allMatch
            tools = @($results)
          } | ConvertTo-Json -Depth 5
          if (-not $allMatch) { exit 1 }