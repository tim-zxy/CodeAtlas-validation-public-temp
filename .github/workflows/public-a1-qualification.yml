name: A1 fixed-source synthetic qualification 406
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-synthetic-formal-qualification
  cancel-in-progress: false
jobs:
  seed:
    if: github.repository == 'tim-zxy/CodeAtlas-validation-public-temp' && github.event.repository.private == false && github.run_attempt == 1
    timeout-minutes: 20
    outputs:
      release_id: ${{ steps.publish.outputs.release_id }}
      asset_id: ${{ steps.publish.outputs.asset_id }}
      archive_sha: ${{ steps.publish.outputs.archive_sha }}
      manifest_sha: ${{ steps.publish.outputs.manifest_sha }}
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Read fixed workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Read exact public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tim-zxy/CodeAtlas
          ref: a1f8fa950d1eea6699ced3ece058f06c53c1c6e1
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
          run_install: false
      - name: One Native build only
        shell: pwsh
        run: |
          & ./control/a1-public-build.ps1 -SourceRoot '${{ github.workspace }}\source' -OutputRoot '${{ runner.temp }}\public-validation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Review allowlisted seed and original build identity
        shell: pwsh
        run: node ./control/a1-public-validation.mjs create ./source '${{ runner.temp }}\public-validation'
      - name: Publish only reviewed seed
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs publish-seed ./source '${{ runner.temp }}\public-validation'
  read_full:
    needs: [seed]
    timeout-minutes: 360
    env:
      SEED_RELEASE_ID: ${{ needs.seed.outputs.release_id }}
      SEED_ASSET_ID: ${{ needs.seed.outputs.asset_id }}
      SEED_ARCHIVE_SHA: ${{ needs.seed.outputs.archive_sha }}
      SEED_MANIFEST_SHA: ${{ needs.seed.outputs.manifest_sha }}
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Read fixed workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Read exact public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tim-zxy/CodeAtlas
          ref: a1f8fa950d1eea6699ced3ece058f06c53c1c6e1
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
          run_install: false
      - name: Prepare exact reader without Native rebuild
        shell: pwsh
        run: |
          & ./control/a1-public-build.ps1 -SourceRoot '${{ github.workspace }}\source' -OutputRoot '${{ runner.temp }}\public-validation' -ReaderOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch exact real release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs fetch-seed ./source '${{ runner.temp }}\public-validation'
      - name: Check identity then complete READ_FULL162
        shell: pwsh
        run: node ./control/a1-public-validation.mjs sample ./source '${{ runner.temp }}\public-validation' READ_FULL162
      - name: Save reviewed complete evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs publish-stage ./source '${{ runner.temp }}\public-validation' READ_FULL162
      - name: Check failure worker cleanup without credentials
        if: failure()
        id: failure_guard
        shell: pwsh
        run: node ./control/a1-public-validation.mjs check-failure-cleanup ./source '${{ runner.temp }}\public-validation'
      - name: Preserve reviewed partial failure reports
        if: failure() && steps.failure_guard.outputs.safe_to_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs preserve-failure ./source '${{ runner.temp }}\public-validation' READ_FULL162
  verify:
    needs: [seed, read_full]
    timeout-minutes: 360
    env:
      SEED_RELEASE_ID: ${{ needs.seed.outputs.release_id }}
      SEED_ASSET_ID: ${{ needs.seed.outputs.asset_id }}
      SEED_ARCHIVE_SHA: ${{ needs.seed.outputs.archive_sha }}
      SEED_MANIFEST_SHA: ${{ needs.seed.outputs.manifest_sha }}
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Read fixed workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Read exact public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tim-zxy/CodeAtlas
          ref: a1f8fa950d1eea6699ced3ece058f06c53c1c6e1
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
          run_install: false
      - name: Prepare exact reader without Native rebuild
        shell: pwsh
        run: |
          & ./control/a1-public-build.ps1 -SourceRoot '${{ github.workspace }}\source' -OutputRoot '${{ runner.temp }}\public-validation' -ReaderOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch exact real release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs fetch-seed ./source '${{ runner.temp }}\public-validation'
      - name: Check identity then complete VERIFY90
        shell: pwsh
        run: node ./control/a1-public-validation.mjs sample ./source '${{ runner.temp }}\public-validation' VERIFY90
      - name: Save reviewed complete evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs publish-stage ./source '${{ runner.temp }}\public-validation' VERIFY90
      - name: Check failure worker cleanup without credentials
        if: failure()
        id: failure_guard
        shell: pwsh
        run: node ./control/a1-public-validation.mjs check-failure-cleanup ./source '${{ runner.temp }}\public-validation'
      - name: Preserve reviewed partial failure reports
        if: failure() && steps.failure_guard.outputs.safe_to_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs preserve-failure ./source '${{ runner.temp }}\public-validation' VERIFY90
  transport:
    needs: [seed, verify]
    timeout-minutes: 360
    env:
      SEED_RELEASE_ID: ${{ needs.seed.outputs.release_id }}
      SEED_ASSET_ID: ${{ needs.seed.outputs.asset_id }}
      SEED_ARCHIVE_SHA: ${{ needs.seed.outputs.archive_sha }}
      SEED_MANIFEST_SHA: ${{ needs.seed.outputs.manifest_sha }}
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Read fixed workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Read exact public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tim-zxy/CodeAtlas
          ref: a1f8fa950d1eea6699ced3ece058f06c53c1c6e1
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
          run_install: false
      - name: Prepare exact reader without Native rebuild
        shell: pwsh
        run: |
          & ./control/a1-public-build.ps1 -SourceRoot '${{ github.workspace }}\source' -OutputRoot '${{ runner.temp }}\public-validation' -ReaderOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch exact real release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs fetch-seed ./source '${{ runner.temp }}\public-validation'
      - name: Check identity then complete TRANSPORT154
        shell: pwsh
        run: node ./control/a1-public-validation.mjs sample ./source '${{ runner.temp }}\public-validation' TRANSPORT154
      - name: Save reviewed complete evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./control/a1-public-validation.mjs publish-stage ./source '${{ runner.temp }}\public-validation' TRANSPORT154
      - name: Check failure worker cleanup without credentials
        if: failure()
        id: failure_guard
        shell: pwsh
        run: node ./control/a1-public-validation.mjs check-failure-cleanup ./source '${{ runner.temp }}\public-validation'
      - name: Preserve reviewed partial failure reports
        if: failure() && steps.failure_guard.outputs.safe_to_publish == 'true'
